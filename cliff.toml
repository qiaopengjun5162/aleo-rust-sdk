# Changelog entries for git-cliff

[changelog]
header = "## Changelog\n"
body = """
{% for group, commits in commits | group_by(attribute=\"group\") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}{% endfor %}
{% endfor %}
"""
trim = true

[git-cliff]
# Parse conventional commits
conventional_commits = true
# Merge commits are not changelog-worthy
skip_merges = true
# Filter out specific commit types
skip_regex = "^chore\\(release\\)|^chore\\(deps\\)"
