[package]
name = "aleo-rust-sdk"
version = "0.3.0-dev"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Rust SDK for the Aleo blockchain — accounts, programs, local ZK execution, network queries, transaction broadcasting"
homepage = "https://github.com/qiaopengjun5162/aleo-rust-sdk"
repository = "https://github.com/qiaopengjun5162/aleo-rust-sdk"
documentation = "https://docs.rs/aleo-rust-sdk"
readme = "README.md"
keywords = ["aleo", "blockchain", "zero-knowledge", "sdk", "snarkvm", "privacy", "cryptography"]
categories = ["cryptography", "web-programming::http-client"]
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
indexmap = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
hex = "0.4"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha2 = "0.10"
rand = "0.8"

# snarkVM — the core zero-knowledge dependency
snarkvm = { version = "4.10.0", default-features = true, features = [
    "ledger",
    "synthesizer",
] }
thiserror = "2.0.21"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[lib]
name = "aleo_rust_sdk"
path = "src/lib.rs"

[[example]]
name = "testnet_query"
path = "examples/testnet_query.rs"

[[example]]
name = "testnet_transfer"
path = "examples/testnet_transfer.rs"

[[example]]
name = "simple_execute"
path = "examples/simple_execute.rs"
