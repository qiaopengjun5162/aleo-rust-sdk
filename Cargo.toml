[workspace]
resolver = "2"
members = [
    "crates/aleo-account",
    "crates/aleo-program",
    "crates/aleo-execution",
    "crates/aleo-network",
    "crates/aleo-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# snarkVM — the heavy dependency
snarkvm = { git = "https://github.com/ProvableHQ/snarkVM.git", rev = "465f847882a347a0559b1db23ad4ff9996f1fd22", features = [
    "synthesizer",
    "ledger",
] }
