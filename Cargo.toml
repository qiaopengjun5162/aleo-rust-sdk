[package]
name = "aleo-rust-sdk"
version = "0.11.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Rust SDK for the Aleo blockchain — accounts, programs, local/remote execution, ZK proving, on-chain verification"
homepage = "https://github.com/qiaopengjun5162/aleo-rust-sdk"
repository = "https://github.com/qiaopengjun5162/aleo-rust-sdk"
documentation = "https://docs.rs/aleo-rust-sdk"
readme = "README.md"
keywords = ["aleo", "blockchain", "zero-knowledge", "sdk", "snarkvm"]
categories = ["cryptography", "web-programming::http-client"]
# snarkVM 4.12.0 itself declares rust-version = "1.96.0", so that — not 1.88 —
# is the real floor. CI verifies this value instead of trusting the comment.
rust-version = "1.96"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
indexmap = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"
zeroize = { version = "1", features = ["zeroize_derive"] }
hex = "0.4"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
rand = "0.8"

# snarkVM — the core zero-knowledge dependency.
# 4.12.0 matches the snarkOS staging rev we previously pinned by git
# (6d7b76515). Using the crates.io release keeps `cargo publish` working.
snarkvm = { version = "4.12.0", default-features = true, features = [
    "ledger",
    "synthesizer",
    # `snarkvm::fields` is not in snarkVM's default feature set, but account seed
    # recovery needs `PrimeField::from_bytes_le_mod_order` — the same reduction
    # the JS binding performs. The crate is already compiled transitively, so
    # this only re-exports it.
    "fields",
] }
# Delegated proving (Provable DPS). `crypto_box`'s `seal` feature implements
# libsodium's `crypto_box_seal`; the DPS only decrypts inside its TEE, so the
# wire format has to match libsodium byte-for-byte (X25519 + XSalsa20-Poly1305,
# tag before ciphertext, nonce = BLAKE2b-192(ephemeral_pk ‖ recipient_pk)).
# base64 is pinned to 0.22 because snarkvm already pulls that version in —
# bumping it here would compile a second copy for no benefit.
crypto_box = { version = "0.9", features = ["seal"] }
base64 = "0.22"
# Metadata page (JS `Metadata` parity) needs the per-function prover/verifier
# checksums that back the parameter download URLs. These come from the same
# crate the JS SDK's wasm build pulls them from, so the URLs stay byte-identical
# to upstream across snarkVM 4.12.0.
snarkvm-parameters = "4.12.0"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
# Only `examples/testnet_transfer.rs` initialises a subscriber; keeping it out
# of [dependencies] stops every library consumer from pulling env-filter in.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lib]
name = "aleo_rust_sdk"
path = "src/lib.rs"

[[example]]
name = "testnet_query"
path = "examples/testnet_query.rs"

[[example]]
name = "testnet_transfer"
path = "examples/testnet_transfer.rs"

[[example]]
name = "simple_execute"
path = "examples/simple_execute.rs"

[[example]]
name = "sdk_v2_broadcast_test"
path = "examples/sdk_v2_broadcast_test.rs"

[[example]]
name = "doc_examples"
path = "examples/doc_examples.rs"
