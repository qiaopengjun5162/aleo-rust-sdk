<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="'SF Mono','Menlo','Monaco','Courier New',monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117" />
      <stop offset="100%" style="stop-color:#161b22" />
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff" />
      <stop offset="100%" style="stop-color:#1f6feb" />
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3fb950" />
      <stop offset="100%" style="stop-color:#238636" />
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d2a8ff" />
      <stop offset="100%" style="stop-color:#8957e5" />
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffa657" />
      <stop offset="100%" style="stop-color:#d29922" />
    </linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff7b72" />
      <stop offset="100%" style="stop-color:#da3633" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="680" fill="url(#bg)" rx="12" />
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="bold" filter="url(#glow)">aleo-rust-sdk 架构图</text>
  
  <!-- User Application -->
  <rect x="350" y="65" width="300" height="45" rx="10" fill="#21262d" stroke="#30363d" stroke-width="2" />
  <text x="500" y="93" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold">用户应用程序 (User App)</text>
  <text x="500" y="115" text-anchor="middle" fill="#8b949e" font-size="11">cargo add aleo-rust-sdk</text>
  <line x1="500" y1="110" x2="500" y2="130" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="500" y1="110" x2="500" y2="340" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6,4" />
  
  <!-- SDK Layer (central box) -->
  <rect x="175" y="130" width="650" height="210" rx="12" fill="#0d1117" stroke="#58a6ff" stroke-width="2" stroke-dasharray="8,4" opacity="0.8" />
  <text x="500" y="152" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">aleo-rust-sdk (单 crate, 5 模块)</text>
  
  <!-- Module boxes -->
  <rect x="195" y="165" width="180" height="55" rx="8" fill="#0d1117" stroke="url(#g1)" stroke-width="2" />
  <text x="285" y="190" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">account 模块</text>
  <text x="285" y="207" text-anchor="middle" fill="#8b949e" font-size="10">密钥 → 地址链</text>
  
  <rect x="410" y="165" width="180" height="55" rx="8" fill="#0d1117" stroke="url(#g3)" stroke-width="2" />
  <text x="500" y="190" text-anchor="middle" fill="#d2a8ff" font-size="12" font-weight="bold">program 模块</text>
  <text x="500" y="207" text-anchor="middle" fill="#8b949e" font-size="10">程序加载/解析</text>
  
  <rect x="625" y="165" width="180" height="55" rx="8" fill="#0d1117" stroke="url(#g4)" stroke-width="2" />
  <text x="715" y="190" text-anchor="middle" fill="#ffa657" font-size="12" font-weight="bold">network 模块</text>
  <text x="715" y="207" text-anchor="middle" fill="#8b949e" font-size="10">v2 REST + JSON-RPC</text>
  
  <rect x="195" y="240" width="180" height="55" rx="8" fill="#0d1117" stroke="url(#g2)" stroke-width="2" />
  <text x="285" y="265" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">execution 模块</text>
  <text x="285" y="282" text-anchor="middle" fill="#8b949e" font-size="10">授权→执行→证明→验证</text>
  
  <rect x="410" y="240" width="395" height="55" rx="8" fill="#0d1117" stroke="url(#g5)" stroke-width="2" />
  <text x="607" y="265" text-anchor="middle" fill="#ff7b72" font-size="12" font-weight="bold">client 模块 (AleoClient 顶层 API)</text>
  <text x="607" y="282" text-anchor="middle" fill="#8b949e" font-size="10">组合 account + program + execution + network</text>
  
  <!-- Dependency arrows inside SDK -->
  <line x1="375" y1="192" x2="410" y2="192" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="590" y1="192" x2="625" y2="192" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow)" />
  
  <!-- Down to snarkVM -->
  <rect x="300" y="360" width="400" height="55" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="2" />
  <text x="500" y="385" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">snarkVM v4.10.0 (crates.io 依赖)</text>
  <text x="500" y="402" text-anchor="middle" fill="#8b949e" font-size="10">零知识证明引擎 · 加密基元 · 协议状态</text>
  <line x1="500" y1="340" x2="500" y2="360" stroke="#e6edf3" stroke-width="1.5" stroke-dasharray="4,3" />
  
  <!-- Network Layer -->
  <rect x="130" y="440" width="740" height="45" rx="10" fill="#0d1117" stroke="#ffa657" stroke-width="2" stroke-dasharray="6,4" />
  <text x="500" y="467" text-anchor="middle" fill="#ffa657" font-size="13" font-weight="bold">网络层</text>
  
  <rect x="145" y="500" width="230" height="55" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="2" />
  <text x="260" y="525" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">v2 REST API</text>
  <text x="260" y="542" text-anchor="middle" fill="#8b949e" font-size="9">api.explorer.provable.com</text>
  
  <rect x="385" y="500" width="230" height="55" rx="8" fill="#0d1117" stroke="#d2a8ff" stroke-width="2" />
  <text x="500" y="525" text-anchor="middle" fill="#d2a8ff" font-size="11" font-weight="bold">JSON-RPC</text>
  <text x="500" y="542" text-anchor="middle" fill="#8b949e" font-size="9">testnetbeta.aleorpc.com</text>
  
  <rect x="625" y="500" width="230" height="55" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2" />
  <text x="740" y="525" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">浏览器 Explorer</text>
  <text x="740" y="542" text-anchor="middle" fill="#8b949e" font-size="9">testnet.explorer.provable.com</text>
  
  <line x1="500" y1="415" x2="500" y2="440" stroke="#ffa657" stroke-width="1.5" />
  
  <!-- Bottom: Aleo Testnet -->
  <rect x="250" y="575" width="500" height="40" rx="10" fill="#0d1117" stroke="#ff7b72" stroke-width="2" />
  <text x="500" y="600" text-anchor="middle" fill="#ff7b72" font-size="14" font-weight="bold">Aleo Testnet (TestnetV0)</text>
  
  <line x1="285" y1="555" x2="285" y2="575" stroke="#8b949e" stroke-width="1" />
  <line x1="500" y1="555" x2="500" y2="575" stroke="#8b949e" stroke-width="1" />
  <line x1="715" y1="555" x2="715" y2="575" stroke="#8b949e" stroke-width="1" />
  
  <!-- Labels -->
  <text x="80" y="500" fill="#8b949e" font-size="10" transform="rotate(-90,80,500)">API 端点</text>
  <text x="60" y="380" fill="#8b949e" font-size="10" transform="rotate(-90,60,380)">ZK 依赖</text>
  <text x="80" y="230" fill="#8b949e" font-size="10" transform="rotate(-90,80,230)">SDK</text>
  
  <!-- Version info bottom-right -->
  <text x="975" y="665" text-anchor="end" fill="#30363d" font-size="9">v0.1.0 → crates.io</text>
</svg>