[config]
git_provider = "github"
use_repo_settings_file = true
publish_output = true
publish_output_progress = true
response_language = "zh-CN"

[github]
publish_as_check_run = false
ignore_bot_pr = true

[pr_reviewer]
require_tests_review = true
require_security_review = true
require_ticket_analysis_review = true
require_estimate_effort_to_review = true
persistent_comment = true
num_max_findings = 5
extra_instructions = """
你是 Aleo Rust SDK 的辅助审查者。全部 review 使用简体中文。

重点检查：
- PR 是否遵循 workspace 结构（crates/ 下按模块拆分）；
- 是否引入了正确的 snarkVM 依赖（git branch testnet）；
- 新的公共 API 是否有文档注释（///）；
- 错误处理是否使用 `thiserror` 自定义 Error 而非 `anyhow`；
- 是否引入不必要的 unsafe 代码；
- 性能敏感路径（证明生成、RPC 轮询）是否考虑了异步/并发安全；
- 是否依赖了未被 workspace Cargo.toml 统一的版本。

不要批准、自动合并，也不要把审查当成 CI 或 owner review 的替代品。
"""

[pr_description]
use_bullet_points = true
publish_description_as_comment = true
publish_description_as_comment_persistent = true
enable_pr_diagram = false
extra_instructions = """
用简体中文描述 PR。说明改动的 crate、验证命令、是否涉及公共 API 变更。
"""

[pr_code_suggestions]
focus_only_on_problems = true
persistent_comment = true
suggestions_score_threshold = 7
extra_instructions = """
只提能降低风险或提升可维护性的建议。不要建议引入新框架。
"""
