# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    #"x86_64-unknown-linux-musl",
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
    # snarkVM transitive deps — unmaintained, no upgrade path.
    # 注意：snarkVM 升级后会失效，cargo-deny 会报 `advisory-not-detected`，
    # 届时删掉对应行即可（fxhash 已在 snarkVM 4.12 中移除）。
    "RUSTSEC-2024-0436", # paste — unmaintained
    "RUSTSEC-2025-0141", # bincode — unmaintained
]
#git-fetch-with-cli = true

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "ISC", "BSD-3-Clause", "MIT-0", "MPL-2.0", "0BSD", "Zlib", "CC0-1.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.8
exceptions = [
    #{ allow = ["Zlib"], crate = "adler32" },
]
[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# 所有依赖均来自 crates.io；如需引入 git 依赖，请显式加白名单并说明原因。
allow-git = []
[sources.allow-org]
github = []
gitlab = []
bitbucket = []
