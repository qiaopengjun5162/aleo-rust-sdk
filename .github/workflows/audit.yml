name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday
  push:
    paths:
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - 'deny.toml'
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Check dependencies
        run: cargo deny check
