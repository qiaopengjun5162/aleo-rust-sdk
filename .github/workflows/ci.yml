name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-rust:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Rust
        run: rustup toolchain install stable --component llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Install typos
        uses: taiki-e/install-action@typos

      - uses: Swatinem/rust-cache@v2

      - name: Check code format
        run: cargo fmt --all -- --check

      - name: Check TOML format
        run: |
          cargo install taplo-cli --locked
          taplo fmt --check

      - name: Check spelling
        run: typos

      - name: Check the package for errors
        run: cargo check --all-features

      - name: Lint rust sources
        run: cargo clippy --all-targets --all-features --tests --benches -- -D warnings

      - name: Audit dependencies
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Execute rust tests
        run: cargo nextest run --all-features || cargo test --all-features

      - name: Generate coverage
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info || echo "coverage skipped"

  package-check:
    name: package-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable

      # 发布前置校验：能在几秒内抓出「git-only 依赖」「缺 version」这类
      # 只在 `cargo publish` 时才暴露的 manifest 错误。
      # --no-verify 跳过重新编译，因此很便宜。
      - name: Verify the crate is publishable
        run: cargo publish --dry-run --no-verify
