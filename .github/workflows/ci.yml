name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A new push to the same branch makes the previous run pointless. Cancel it so
# queue time goes to the commit that actually matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-rust:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    # The full run sits around 25 min; 60 leaves room for a cold cache without
    # letting a hung step burn the 6 h default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # No submodules, and nothing here needs git history any more
          # (changelog generation moved to release-please). A shallow clone
          # is faster and the default depth is enough.
          fetch-depth: 1

      - name: Install Rust
        run: rustup toolchain install stable --component llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Install typos
        uses: taiki-e/install-action@typos

      # taplo is in taiki-e's supported-tool list, so this downloads a prebuilt
      # binary. `cargo install taplo-cli --locked` compiled it from source on
      # every single run.
      - name: Install taplo
        uses: taiki-e/install-action@taplo

      - uses: Swatinem/rust-cache@v2

      - name: Check code format
        run: cargo fmt --all -- --check

      - name: Check TOML format
        run: taplo fmt --check

      - name: Check spelling
        run: typos

      - name: Lint rust sources
        run: cargo clippy --all-targets --all-features --tests --benches -- -D warnings

      - name: Audit dependencies
        uses: EmbarkStudios/cargo-deny-action@v2

      # rustdoc resolves every intra-doc link. Without this step a doc comment
      # can reference a type that no longer exists and nothing notices — the
      # crate still builds, the link is just dead on docs.rs.
      - name: Build docs (warn on broken links)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      # `cargo nextest` does NOT run doc-tests, so they need their own step.
      # The previous `nextest || cargo test` fallback hid this: as long as
      # nextest succeeded, the rustdoc examples in src/ were never compiled.
      - name: Execute rust tests
        run: cargo nextest run --all-features

      - name: Execute doc-tests
        run: cargo test --doc --all-features

      # The threshold is what turns coverage from a number nobody reads into a
      # gate. Without it, generating lcov.info and uploading it only proved the
      # command ran — coverage could have fallen to any value and CI stayed green.
      #
      # Measured baseline: 87.74% by llvm-cov's line totals (88.36% if you recount
      # the lcov file, because macro and generic expansions are counted
      # differently). The gate uses llvm-cov's number — `--fail-under-lines 87`
      # passes and 88 fails against that 87.74 — so 85 leaves ~3 points of
      # headroom for ordinary refactoring while still failing if a module loses
      # its tests. Raise this when a round of test work lifts the baseline; a gate
      # that sits far below reality only ratchets down.
      - name: Generate coverage
        run: |
          cargo llvm-cov --all-features \
            --lcov --output-path lcov.info \
            --fail-under-lines 85

      # Print the per-file table into the job summary. An aggregate percentage
      # hides the shape of the problem: 70% overall is very different depending
      # on whether it is spread evenly or one module at 100% covering five at 40%.
      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          path = "lcov.info"
          if not os.path.exists(path):
              print("## Coverage\n\n`lcov.info` was not produced — see the step above.\n")
              raise SystemExit(0)
          files, cur = {}, None
          for line in open(path):
              line = line.rstrip("\n")
              if line.startswith("SF:"):
                  cur = line[3:]
                  files[cur] = [0, 0]
              elif line.startswith("DA:") and cur:
                  cnt = int(line[3:].split(",")[1])
                  files[cur][1] += 1
                  if cnt > 0:
                      files[cur][0] += 1
              elif line == "end_of_record":
                  cur = None
          src = {k: v for k, v in files.items() if "/src/" in k}
          hit = sum(v[0] for v in src.values())
          total = sum(v[1] for v in src.values())
          pct = hit / total * 100 if total else 0.0
          print("## Coverage\n")
          print(f"**src/ total: {hit}/{total} lines = {pct:.1f}%**\n")
          print(
              "Counted from `lcov.info`; the gate uses llvm-cov's own line totals, "
              "which read slightly lower (macro/generic expansion). Recent baseline: "
              "88.36% lcov / 87.74% llvm-cov, gate 85%.\n"
          )
          print("| File | Coverage | Lines |")
          print("|---|---:|---:|")
          for k, v in sorted(src.items(), key=lambda kv: (kv[1][0] / kv[1][1]) if kv[1][1] else 1):
              p = v[0] / v[1] * 100 if v[1] else 100.0
              print(f"| `{k.split('/src/')[-1]}` | {p:.1f}% | {v[1]} |")
          PY

      # The report is the whole point of the previous step; without this upload
      # the 6 minutes of instrumented rebuilding produce a file that is deleted
      # together with the runner.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: lcov.info
          retention-days: 14

  package-check:
    name: package-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable

      # 发布前置校验：能在几秒内抓出「git-only 依赖」「缺 version」这类
      # 只在 `cargo publish` 时才暴露的 manifest 错误。
      # --no-verify 跳过重新编译，因此很便宜。
      - name: Verify the crate is publishable
        run: cargo publish --dry-run --no-verify

  # `rust-version` is a promise to downstream users. Nothing else in this
  # workflow checks it: `stable` is always newer, so a dependency could quietly
  # raise the real floor while the manifest keeps advertising the old number.
  # (That is exactly what happened with the old `rust-version = "1.88"` —
  # snarkVM 4.12.0 actually requires 1.96.0.)
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Read the number from the manifest rather than hardcoding it here. A
      # hardcoded job keeps happily testing the old version after the promise
      # changes, which is another way of being green and wrong.
      - name: Read declared MSRV
        id: msrv
        run: |
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].rust_version')
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::Cargo.toml has no rust-version; the MSRV promise is unverifiable"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Declared MSRV: $version"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Separate cache: mixing MSRV artifacts with stable ones would
          # invalidate both on every switch.
          key: msrv-${{ steps.msrv.outputs.version }}

      - name: Check with the declared MSRV
        run: cargo +${{ steps.msrv.outputs.version }} check --all-features
