# TEMPORARY self-test — deleted before merge.
#
# Exercises exactly the mechanism release-please.yml relies on: calling
# publish.yml as a reusable workflow with `secrets: inherit`. Without this the
# wiring would only be proven at the next real release, i.e. after the point
# where a mistake can still be fixed cheaply.
name: Reusable call self-test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  call:
    uses: ./.github/workflows/publish.yml
    with:
      tag: aleo-rust-sdk-v0.9.0
    secrets: inherit
