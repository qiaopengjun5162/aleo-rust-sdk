name: Slow tests

# The proving tests in `tests/real_prove.rs` are `#[ignore]`d: one Varuna proof
# costs 15-60 s of CPU (61.8 s for the smallest one, hello.aleo), and
# instrumented coverage runs are slower still. Keeping them in the PR gate would
# add minutes to every push.
#
# Leaving them *only* `#[ignore]`d has the opposite problem: `prove_and_package`
# — the function every transaction goes through — then runs in no CI job at all,
# so a regression there ships silently. This workflow is the middle ground: the
# ignored tests still run automatically, just on a schedule instead of per PR.
#
# The second job, `fresh-resolve`, is unrelated to proving. It covers a gap the
# PR gate structurally cannot: CI tests `Cargo.lock`, and nobody who depends on
# this crate ever sees that lock.
#
# Run it on demand:
#   gh workflow run slow-tests.yml

on:
  schedule:
    # 18:00 UTC = 02:00 Beijing, i.e. outside working hours.
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  proving:
    runs-on: ubuntu-latest
    # 5 ignored tests at up to ~60 s each, plus a cold snarkVM build.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Rust
        run: rustup toolchain install stable

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2

      # `--run-ignored ignored-only` runs exactly the tests the PR gate skips.
      # The fixture generator is excluded here and regenerated in its own step
      # below, so it does not cost 60 s twice.
      - name: Run the ignored (proving) tests
        run: |
          cargo nextest run --all-features --run-ignored ignored-only \
            -E 'not test(regenerate_verify_fixture)'

      # The fixture generator is also `#[ignore]`d; running it proves the
      # committed `tests/fixtures/credits_execute_tx.json` is still reproducible
      # with today's snarkVM parameters, and that the offline verify tests are
      # not feeding on a hand-edited artifact.
      - name: Regenerate the verification fixture
        run: cargo test --test real_prove -- --ignored regenerate_verify_fixture

      - name: The fixture still verifies
        run: cargo test --test client_async_test verify_execution

  # `Cargo.lock` is committed and every gate job runs `--locked`, so CI tests the
  # versions pinned the day the lock was written. A consumer never sees that
  # lock: a fresh `cargo add` resolves the newest semver-compatible versions
  # instead. At 0.12.0 the crate declares `snarkvm = "4.12.0"` and locks
  # 4.12.0, while a clean consumer resolves 4.13.1 — a combination no job had
  # ever run.
  #
  # This job resolves the graph the way a new user's cargo does and runs the
  # same suite over it. On the day it was added the resolution moved snarkVM
  # 4.12.0 -> 4.13.1 and the suite passed 779/779, so it starts from green
  # rather than from an excuse.
  #
  # Scheduled rather than per-PR on purpose: an upstream release that breaks us
  # is news, not a reason to hold up someone else's unrelated pull request.
  fresh-resolve:
    name: fresh dependency resolution
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Rust
        run: rustup toolchain install stable

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2

      # `cargo update` prints every move it makes, which is most of the
      # diagnosis when this job goes red.
      - name: Resolve the newest semver-compatible versions
        run: cargo update

      - name: Record the versions that resolve to
        run: |
          cargo tree -p snarkvm --depth 0
          cargo tree -p snarkvm-parameters --depth 0

      - name: Execute rust tests
        run: cargo nextest run --all-features

      - name: Execute doc-tests
        run: cargo test --doc --all-features
