name: PR Agent

on:
  pull_request:
    types:
      - opened
      - synchronize
  issue_comment:
    types:
      - created
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  pr-agent:
    name: PR-Agent review assistant
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # AI review 是辅助工具，不是质量闸门。上游模型服务（订阅到期 / 限流 /
    # 宕机）不应阻塞代码合并——那会让所有人等一个第三方服务。
    # 真实质量由 CI 的 fmt/clippy/test/typos/deny 把关。
    continue-on-error: true
    if: >
      github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        startsWith(github.event.comment.body, '/')
      )
    steps:
      - uses: the-pr-agent/pr-agent@8e4d32e5497defd43c023a404f73560c62728961
        # 同上：PR-Agent 内部步骤失败也允许整个 job 走完，不产生红色 check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.PR_AGENT_OPENAI_KEY }}
          OPENAI.API_BASE: ${{ secrets.PR_AGENT_OPENAI_API_BASE }}
          # litellm reads OPENAI_API_BASE (underscore), not OPENAI.API_BASE (dot)
          OPENAI_API_BASE: ${{ secrets.PR_AGENT_OPENAI_API_BASE }}
          config.model: ${{ vars.PR_AGENT_MODEL || 'openai/deepseek_v4' }}
          config.fallback_models: ${{ format('["{0}"]', vars.PR_AGENT_MODEL || 'openai/deepseek_v4') }}
          config.custom_model_max_tokens: 4096
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
        with:
          args: review --pr_url ${{ github.event.pull_request.html_url || github.event.issue.html_url }}
